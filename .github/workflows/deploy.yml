name: Build and Deploy JupyterLite

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install JupyterLite
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Stage content for browser filesystem
        run: |
          rm -rf lite-content dist
          mkdir -p lite-content
          cp -R notebooks/* lite-content/
          cp -R data shapefiles geopackages images videos lite-content/
          cp spatial_lite.py lite-content/
          cp README.md lite-content/
      - name: Build JupyterLite site
        run: |
          jupyter lite build --contents lite-content --output-dir dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
